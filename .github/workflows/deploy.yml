name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  APP_DIR: /opt/matrimony-api
  SERVICE_NAME: matrimony-api

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint & Validate
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile main.py
          python -m py_compile config.py
          python -m py_compile database.py
          find routes services models -name "*.py" -exec python -m py_compile {} +

  # ──────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment..."

            cd ${{ env.APP_DIR }}

            # Pull latest code
            echo "📥 Pulling latest code from main..."
            sudo -u matrimony git fetch origin main
            sudo -u matrimony git reset --hard origin/main

            # Install/update dependencies
            echo "📦 Installing dependencies..."
            sudo -u matrimony bash -c "
              source .venv/bin/activate
              pip install --upgrade pip -q
              pip install -r requirements.txt -q
              pip install gunicorn -q
            "

            # Restart the service
            echo "🔄 Restarting service..."
            sudo systemctl restart matrimony-api

            # Wait and verify
            sleep 3
            if sudo systemctl is-active --quiet matrimony-api; then
              echo "✅ Deployment successful! Service is running."
            else
              echo "❌ Deployment failed! Service is not running."
              sudo journalctl -u matrimony-api --no-pager -n 30
              exit 1
            fi

            # Health check
            echo "🏥 Running health check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_STATUS)"
            else
              echo "⚠️  Health check returned HTTP $HTTP_STATUS (service may still be starting)"
            fi

            echo "🎉 Deployment complete!"
